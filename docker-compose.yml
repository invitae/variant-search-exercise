version: '3'

services:
  backend:
    build: ./backend
    command: ["bash", "docker-entrypoint.sh"]
    volumes:
      - ./backend:/opt/backend
      - ./data:/opt/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/opt/frontend
      - node-modules:/opt/frontend/node_modules
    ports:
      - "3000:3000"
    restart: on-failure

  spark:
    build: ./spark
    user: root
    ports:
      - "8888:8888"
    volumes:
      - ./data:/home/jovyan/data:ro
      - ./spark/notebooks:/home/jovyan/work
      - ./spark/output:/home/jovyan/output
      - ./spark/solutions:/home/jovyan/solutions:ro
    environment:
      - NB_UID=${UID}
      - CHOWN_HOME=yes
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=variant-exercise

volumes:
  node-modules:
